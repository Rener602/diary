<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Тест базы</title></head>
<body style="padding: 20px; font-family: sans-serif; background: #222; color: #fff;">
  <h2>Проверка связи с Firebase</h2>
  <div id="result" style="font-size: 18px; margin-top: 20px; color: yellow;">Идет запрос...</div>
  
  <script>
    const url = "https://diary-491d6-default-rtdb.firebaseio.com/test.json";
    
    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error("HTTP ошибка: " + res.status);
        return res.text();
      })
      .then(data => {
        if (data === "null") {
          document.getElementById('result').innerHTML = "✅ <b>УСПЕХ!</b><br>База отвечает. Но она пустая.<br>Значит, правила настроены верно.";
        } else {
          document.getElementById('result').innerHTML = "✅ <b>УСПЕХ!</b><br>База ответила: " + data;
        }
      })
      .catch(err => {
        document.getElementById('result').innerHTML = "❌ <b>ОШИБКА!</b><br>" + err.message + "<br><br><b>Причина:</b> База данных заблокировала запрос. Скорее всего, ты не нажал кнопку 'Опубликовать' (Publish) во вкладке 'Правила' (Rules) в Firebase.";
        document.getElementById('result').style.color = "red";
      });
  </script>
</body>
</html>
