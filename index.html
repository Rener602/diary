<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Электронный дневник</title>
<style>
  :root {
    --bg: #f0f2f5; --card-bg: #ffffff; --text-main: #1c1e21; --text-muted: #888;
    --border: #eef0f3; --input-bg: #f8f9fb; --header-shadow: rgba(0,0,0,.05);
    --card-shadow: rgba(0,0,0,.04); --lesson-bg: #f8f9fb; --nav-bg: #ffffff; --nav-border: #f0f0f0;
  }
  body.dark {
    --bg: #121212; --card-bg: #1e1e1e; --text-main: #e4e6eb; --text-muted: #a0a0a0;
    --border: #333333; --input-bg: #2c2c2c; --header-shadow: rgba(0,0,0,.3);
    --card-shadow: rgba(0,0,0,.2); --lesson-bg: #2c2c2c; --nav-bg: #1e1e1e; --nav-border: #333333;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--text-main); -webkit-font-smoothing: antialiased; touch-action: manipulation; transition: background 0.3s, color 0.3s; }

  #loginScreen { min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea, #764ba2); padding: 20px; }
  .login-box { background: #fff; padding: 32px 24px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); width: 100%; max-width: 380px; }
  .login-box h1 { text-align: center; margin-bottom: 6px; color: #333; font-size: 24px; }
  .login-box p.sub { text-align: center; color: #888; margin-bottom: 22px; font-size: 13px; }
  .login-box input { width: 100%; padding: 16px 18px; margin-bottom: 14px; border: 2px solid #eef0f3; border-radius: 14px; font-size: 16px; outline: none; background: #f8f9fb; color: #1c1e21; }
  .login-box input:focus { border-color: #667eea; background: #fff; }
  .login-box button { width: 100%; padding: 17px; background: #667eea; color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; }
  .login-box button:active { transform: scale(.97); background: #556cd6; }
  .error { color: #e74c3c; font-size: 13px; text-align: center; margin-bottom: 10px; min-height: 18px; }

  #app { display: none; padding-bottom: calc(72px + env(safe-area-inset-bottom)); min-height: 100dvh; }
  header { background: var(--card-bg); padding: 14px 18px; padding-top: calc(14px + env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 12px var(--header-shadow); transition: background 0.3s; }
  header .logo { font-size: 17px; font-weight: 700; color: #667eea; }
  header .user { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  header .user .uname { font-size: 13px; color: var(--text-muted); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-main); padding: 5px; }

  .container { padding: 16px; max-width: 600px; margin: 0 auto; }
  .tab-content { display: none; animation: fadeIn .2s ease; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px var(--card-shadow); margin-bottom: 14px; transition: background 0.3s; }
  .card h2 { font-size: 16px; margin-bottom: 12px; color: var(--text-main); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg); display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 20px var(--header-shadow); z-index: 30; border-top: 1px solid var(--nav-border); }
  .bottom-nav button { flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; color: var(--text-muted); font-size: 10px; font-weight: 600; transition: .15s; border-radius: 10px; }
  .bottom-nav button .icon { font-size: 22px; line-height: 1; transition: .15s; }
  .bottom-nav button.active { color: #667eea; }
  .bottom-nav button.active .icon { transform: scale(1.15); }

  .subject-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; background: var(--lesson-bg); border-radius: 12px; margin-bottom: 10px; gap: 8px; }
  .subject-card .subj-name { font-weight: 600; font-size: 14px; color: var(--text-main); flex: 1; min-width: 0; }
  .grades-row { display: flex; gap: 5px; flex-shrink: 0; }
  .grade-pill { width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 8px; font-weight: 700; color: #fff; font-size: 13px; }
  .grade-pill.empty { background: var(--border); color: var(--text-muted); }
  .g5 { background: #27ae60; } .g4 { background: #3498db; } .g3 { background: #f39c12; } .g2 { background: #e74c3c; }
  .avg-badge { margin-left: 6px; font-size: 12px; font-weight: 700; color: #667eea; background: rgba(102, 126, 234, 0.15); padding: 4px 8px; border-radius: 8px; }

  .day-block { margin-bottom: 16px; }
  .day-name { font-weight: 700; color: #667eea; margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; }
  .lesson { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--lesson-bg); border-radius: 12px; margin-bottom: 7px; font-size: 13px; }
  .lesson .num { width: 26px; height: 26px; line-height: 26px; text-align: center; background: rgba(102, 126, 234, 0.15); color: #667eea; border-radius: 8px; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .lesson .info { flex: 1; }
  .lesson .info .name { font-weight: 600; color: var(--text-main); }
  .lesson .room { font-size: 11px; color: #667eea; background: rgba(102, 126, 234, 0.15); padding: 3px 8px; border-radius: 6px; font-weight: 600; }

  input, select { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; background: var(--input-bg); margin-bottom: 8px; color: var(--text-main); }
  input:focus, select:focus { border-color: #667eea; }
  .btn { width: 100%; padding: 12px; background: #667eea; color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .btn:active { background: #556cd6; }
  .btn-green { background: #27ae60; }
  .admin-box { margin-bottom:20px; background:var(--input-bg); padding:12px; border-radius:10px; border: 1px solid var(--border); }
  .admin-box h3 { font-size:13px; color:#f39c12; margin-bottom:8px; }
  
  .student-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .student-row:last-child { border-bottom: none; }
  .student-info { flex: 1; }
  .student-info b { color: #667eea; font-size: 15px; display: block; margin-bottom: 3px;}
  .student-info .details { font-size: 12px; color: var(--text-muted); }
  .student-info .pass-text { color: #e74c3c; font-weight: 600; margin-left: 5px;}
  .badge-admin { background: #f39c12; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; vertical-align: middle; }
  .action-btns { display: flex; gap: 5px; }
  .action-btns button { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; }
  .empty-state { text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>📚 Дневник</h1>
    <p class="sub">Вход в систему</p>
    <div class="error" id="errorMsg"></div>
    <input type="text" id="loginUser" placeholder="Логин" autocapitalize="none">
    <input type="password" id="loginPass" placeholder="Пароль">
    <button onclick="login()">Войти</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">📚 Дневник</div>
    <div class="user">
      <span class="uname" id="userName"></span>
      <div class="avatar" id="avatar"></div>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" onclick="logout()">🚪</button>
    </div>
  </header>

  <div class="container">
    <div id="tab-grades" class="tab-content active">
      <div class="card">
        <h2>📊 Мои оценки <span id="studentClassBadge" class="avg-badge"></span></h2>
        <div id="gradesList"><div class="empty-state">Загрузка...</div></div>
      </div>
    </div>

    <div id="tab-schedule" class="tab-content">
      <div class="card">
        <h2>🗓️ Расписание (Общее)</h2>
        <div id="scheduleList"><div class="empty-state">Загрузка...</div></div>
        
        <div id="scheduleEditor" style="display:none; margin-top:20px; border-top:1px solid var(--border); padding-top:15px;">
          <h3 style="font-size:14px; margin-bottom:10px; color:#667eea;">Добавить урок</h3>
          <select id="editDay">
            <option value="0">Понедельник</option><option value="1">Вторник</option>
            <option value="2">Среда</option><option value="3">Четверг</option><option value="4">Пятница</option>
          </select>
          <input type="text" id="editSubject" placeholder="Название урока">
          <input type="text" id="editRoom" placeholder="Кабинет">
          <button class="btn" onclick="saveLesson()">Добавить в облако</button>
        </div>
      </div>
    </div>

    <div id="tab-admin" class="tab-content">
      <div class="card">
        <h2>⚙️ Учительская</h2>
        <div class="admin-box">
          <h3>Мой класс</h3>
          <select id="myClassSelect" onchange="changeMyClass(this.value)">
            <option value="1А">1А</option><option value="1Б">1Б</option>
            <option value="2А">2А</option><option value="2Б">2Б</option>
            <option value="3А">3А</option><option value="3Б">3Б</option>
            <option value="4А">4А</option><option value="4Б">4Б</option>
            <option value="5А">5А</option><option value="5Б">5Б</option>
            <option value="6А">6А</option><option value="6Б">6Б</option>
            <option value="7А">7А</option><option value="7Б">7Б</option>
            <option value="8А">8А</option><option value="8Б">8Б</option>
            <option value="9А">9А</option><option value="9Б">9Б</option>
            <option value="10А">10А</option><option value="10Б">10Б</option>
            <option value="11А">11А</option><option value="11Б">11Б</option>
          </select>
        </div>

        <div id="teacherGradeBox" style="display:none; border-left: 4px solid #f39c12; padding-left: 12px; margin-bottom: 20px;">
          <h3 style="font-size:13px; color:#f39c12; margin-bottom:10px;">Выдать оценку</h3>
          <select id="adminStudent"></select>
          <select id="adminSubject"></select>
          <div style="display:flex; gap:8px;">
            <select id="adminGrade"><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option></select>
            <select id="adminDay"><option value="0">Пн</option><option value="1">Вт</option><option value="2">Ср</option><option value="3">Чт</option><option value="4">Пт</option></select>
          </div>
          <button class="btn" onclick="teacherSetGrade()">Поставить оценку</button>
        </div>

        <div id="manageStudentsBox" style="display:none; border-top: 1px solid var(--border); padding-top: 15px;">
          <h3 style="font-size:14px; color:#667eea; margin-bottom:10px;">База пользователей</h3>
          <div id="studentsList" style="margin-bottom: 20px;"></div>
          <div style="background:var(--input-bg); padding:12px; border-radius:10px;">
            <p style="font-size:13px; margin-bottom:10px; font-weight:600; color:#667eea;">➕ Создать нового ученика</p>
            <input type="text" id="newStLogin" placeholder="Логин (англ. буквы)">
            <input type="text" id="newStName" placeholder="Имя (напр. Иван)">
            <input type="password" id="newStPass" placeholder="Пароль">
            <select id="newStClass">
              <option value="1А">1А</option><option value="1Б">1Б</option>
              <option value="2А">2А</option><option value="2Б">2Б</option>
              <option value="3А">3А</option><option value="3Б">3Б</option>
              <option value="4А">4А</option><option value="4Б">4Б</option>
              <option value="5А">5А</option><option value="5Б">5Б</option>
              <option value="6А">6А</option><option value="6Б">6Б</option>
              <option value="7А">7А</option><option value="7Б">7Б</option>
              <option value="8А">8А</option><option value="8Б">8Б</option>
              <option value="9А">9А</option><option value="9Б">9Б</option>
              <option value="10А">10А</option><option value="10Б">10Б</option>
              <option value="11А">11А</option><option value="11Б">11Б</option>
            </select>
            <button class="btn btn-green" onclick="addNewStudent()">Зарегистрировать в облаке</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="active" onclick="showTab('grades', this)"><span class="icon">📊</span>Оценки</button>
    <button onclick="showTab('schedule', this)"><span class="icon">🗓️</span>Уроки</button>
    <button onclick="showTab('admin', this)"><span class="icon">⚙️</span>Учительская</button>
  </nav>
</div>

<script>
const FIREBASE_URL = "https://diary-491d6-default-rtdb.firebaseio.com"; 
const BASE_SUBJECTS = ["Математика", "Русский язык", "Литература", "История", "Физика", "Химия", "Английский", "Информатика", "Биология", "Физкультура"];
const DEFAULT_SCHEDULE = [
  { day: "Понедельник", lessons: [] }, { day: "Вторник", lessons: [] },
  { day: "Среда", lessons: [] }, { day: "Четверг", lessons: [] }, { day: "Пятница", lessons: [] }
];

let USERS = {};
let GLOBAL_SCHEDULE = DEFAULT_SCHEDULE;
let currentUser = null;
let showPasswords = false;

function initTheme() {
  const savedTheme = localStorage.getItem('diary_theme');
  const themeBtn = document.getElementById('themeBtn');
  if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.body.classList.add('dark'); themeBtn.textContent = '☀️';
  } else { themeBtn.textContent = '🌙'; }
}
function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('diary_theme', isDark ? 'dark' : 'light');
}

// СИНХРОНИЗАЦИЯ С FIREBASE
async function cloudGet(path) {
  try {
    const res = await fetch(FIREBASE_URL + path + ".json");
    return await res.json();
  } catch(e) { return null; }
}
async function cloudSet(path, data) {
  try {
    await fetch(FIREBASE_URL + path + ".json", { method: 'PUT', body: JSON.stringify(data) });
  } catch(e) {}
}

async function login() {
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value.trim();
  
  document.getElementById('errorMsg').textContent = 'Связь с базой...';
  
  // Загружаем базу пользователей
  let users = await cloudGet("/users");
  
  // Если базы нет - создаем стартовую
  if (!users) {
    users = {
      "admin":  { pass: "admin2024",  name: "Хозяин", role: "admin",   class: "9А" },
      "friend": { pass: "friend2024", name: "Друг",   role: "student", class: "9А" }
    };
    await cloudSet("/users", users);
  }
  USERS = users;

  // Загружаем расписание
  let sch = await cloudGet("/schedule");
  if (!sch) {
    await cloudSet("/schedule", DEFAULT_SCHEDULE);
    GLOBAL_SCHEDULE = DEFAULT_SCHEDULE;
  } else {
    GLOBAL_SCHEDULE = sch;
  }

  // Проверка пароля
  if (USERS[u] && USERS[u].pass === p) {
    currentUser = u;
    sessionStorage.setItem('diary_user_v9', u);
    document.getElementById('errorMsg').textContent = '';
    startApp();
  } else {
    document.getElementById('errorMsg').textContent = 'Неверный логин или пароль';
  }
}

function logout() { sessionStorage.removeItem('diary_user_v9'); location.reload(); }

async function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  updateUIForRole();
  await initGrades();
  renderAll();
}

function updateUIForRole() {
  const info = USERS[currentUser];
  if (!info) return;
  document.getElementById('userName').textContent = info.name;
  document.getElementById('avatar').textContent = info.name[0].toUpperCase();
  
  const isAdmin = info.role === 'admin';
  document.getElementById('scheduleEditor').style.display = isAdmin ? 'block' : 'none';
  document.getElementById('teacherGradeBox').style.display = isAdmin ? 'block' : 'none';
  document.getElementById('manageStudentsBox').style.display = isAdmin ? 'block' : 'none';
}

async function initGrades() {
  for (const u of Object.keys(USERS)) {
    let grades = await cloudGet("/grades/" + u);
    if (!grades) {
      const g = {}; BASE_SUBJECTS.forEach(s => g[s] = [null,null,null,null,null]);
      await cloudSet("/grades/" + u, g);
    }
  }
}

function showTab(name, btn) {
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  window.scrollTo(0,0);
  if (name === 'admin') renderAdmin();
  if (name === 'schedule') renderSchedule();
  if (name === 'grades') renderGrades();
}

function renderAll() { renderGrades(); renderSchedule(); renderAdmin(); }

async function renderGrades() {
  if (!USERS[currentUser]) return;
  document.getElementById('studentClassBadge').textContent = USERS[currentUser].class || "—";
  const grades = await cloudGet("/grades/" + currentUser) || {};
  
  document.getElementById('gradesList').innerHTML = BASE_SUBJECTS.map(subj => {
    const arr = grades[subj] || [null,null,null,null,null];
    const valid = arr.filter(x => x);
    const avg = valid.length ? (valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(1) : '—';
    const pills = arr.map(g => g ? `<span class="grade-pill g${g}">${g}</span>` : `<span class="grade-pill empty">·</span>`).join('');
    return `<div class="subject-card"><div class="subj-name">${subj}</div><div class="grades-row">${pills}</div><div class="avg-badge">${avg}</div></div>`;
  }).join('');
}

async function renderSchedule() {
  GLOBAL_SCHEDULE = await cloudGet("/schedule") || DEFAULT_SCHEDULE;
  const isAdmin = USERS[currentUser] && USERS[currentUser].role === 'admin';
  
  document.getElementById('scheduleList').innerHTML = GLOBAL_SCHEDULE.map((d, i) => `
    <div class="day-block">
      <div class="day-name">📅 ${d.day} ${isAdmin ? `<button onclick="clearDay(${i})" style="border:none; background:none; color:#e74c3c; font-size:12px;">Очистить</button>` : ''}</div>
      ${d.lessons.length ? d.lessons.map((l, j) => `
        <div class="lesson">
          <span class="num">${l.num}</span>
          <div class="info"><div class="name">${l.name}</div></div>
          <span class="room">${l.room}</span>
          ${isAdmin ? `<button onclick="deleteLesson(${i}, ${j})" style="background:none; border:none; color:#e74c3c; margin-left:8px;">✕</button>` : ''}
        </div>
      `).join('') : '<div style="font-size:12px;color:var(--text-muted);padding:10px;">Нет уроков</div>'}
    </div>
  `).join('');
}

async function saveLesson() {
  const dayIdx = parseInt(document.getElementById('editDay').value);
  const subj = document.getElementById('editSubject').value.trim();
  const room = document.getElementById('editRoom').value.trim();
  if (!subj) return alert('Введите название урока');

  let sch = await cloudGet("/schedule") || DEFAULT_SCHEDULE;
  sch[dayIdx].lessons.push({ num: sch[dayIdx].lessons.length + 1, name: subj, room: room || "—" });
  await cloudSet("/schedule", sch);
  document.getElementById('editSubject').value = ''; document.getElementById('editRoom').value = '';
  renderSchedule();
}

async function deleteLesson(dayIdx, lessonIdx) {
  let sch = await cloudGet("/schedule") || DEFAULT_SCHEDULE;
  sch[dayIdx].lessons.splice(lessonIdx, 1);
  sch[dayIdx].lessons.forEach((l, i) => l.num = i + 1);
  await cloudSet("/schedule", sch);
  renderSchedule();
}

async function clearDay(dayIdx) {
  if (!confirm('Удалить все уроки в этот день для ВСЕХ?')) return;
  let sch = await cloudGet("/schedule") || DEFAULT_SCHEDULE;
  sch[dayIdx].lessons = [];
  await cloudSet("/schedule", sch);
  renderSchedule();
}

function renderAdmin() {
  if (!USERS[currentUser]) return;
  document.getElementById('myClassSelect').value = USERS[currentUser].class || "9А";
  
  const stSelect = document.getElementById('adminStudent');
  stSelect.innerHTML = Object.keys(USERS).map(u => `<option value="${u}">${USERS[u].name} (@${u})</option>`).join('');

  const subSelect = document.getElementById('adminSubject');
  if (!subSelect.options.length) {
    BASE_SUBJECTS.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; subSelect.appendChild(o); });
  }

  if (USERS[currentUser].role === 'admin') {
    const listEl = document.getElementById('studentsList');
    let html = `<div style="text-align:right; margin-bottom:10px;">
      <button onclick="togglePasswords()" style="background:none; border:none; color:#667eea; font-size:12px; font-weight:600; cursor:pointer;">
        ${showPasswords ? 'Скрыть пароли' : 'Показать пароли'}
      </button>
    </div>`;

    html += Object.keys(USERS).map(u => {
      const user = USERS[u];
      const passDisplay = showPasswords ? `<span class="pass-text">🔑 ${user.pass}</span>` : `<span style="color:var(--text-muted)">🔑 ••••••••</span>`;
      const isTargetAdmin = user.role === 'admin';
      const roleBadge = isTargetAdmin ? `<span class="badge-admin">ADMIN</span>` : '';
      const delBtn = u === 'admin' ? '' : `<button onclick="deleteStudent('${u}')" title="Удалить">🗑️</button>`;
      const adminBtn = u === 'admin' ? '' : `<button onclick="toggleAdmin('${u}')" title="${isTargetAdmin ? 'Забрать админку' : 'Сделать админом'}" style="color: ${isTargetAdmin ? '#f39c12' : '#27ae60'};">${isTargetAdmin ? '👑' : '⬆️'}</button>`;

      return `
        <div class="student-row">
          <div class="student-info">
            <b>${user.name} ${roleBadge}</b>
            <div class="details">Логин: <b>${u}</b> | Класс: ${user.class || '—'} | ${passDisplay}</div>
          </div>
          <div class="action-btns">${adminBtn} ${delBtn}</div>
        </div>
      `;
    }).join('');
    listEl.innerHTML = html;
  }
}

function togglePasswords() { showPasswords = !showPasswords; renderAdmin(); }

async function changeMyClass(newClass) {
  USERS[currentUser].class = newClass;
  await cloudSet("/users/" + currentUser, USERS[currentUser]);
  renderGrades();
}

async function teacherSetGrade() {
  const student = document.getElementById('adminStudent').value;
  const subj = document.getElementById('adminSubject').value;
  const grade = parseInt(document.getElementById('adminGrade').value);
  const dayIdx = parseInt(document.getElementById('adminDay').value);

  let grades = await cloudGet("/grades/" + student) || {};
  if (!grades[subj]) grades[subj] = [null,null,null,null,null];
  grades[subj][dayIdx] = grade;
  await cloudSet("/grades/" + student, grades);

  alert(`Оценка ${grade} выставлена: ${USERS[student].name}`);
  if (student === currentUser) renderGrades();
}

async function addNewStudent() {
  const login = document.getElementById('newStLogin').value.trim().toLowerCase();
  const name = document.getElementById('newStName').value.trim();
  const pass = document.getElementById('newStPass').value.trim();
  const cls = document.getElementById('newStClass').value;

  if (!login || !name || !pass) return alert('Заполните все поля!');
  let users = await cloudGet("/users") || {};
  if (users[login]) return alert('Такой логин уже существует!');

  users[login] = { pass: pass, name: name, role: "student", class: cls };
  await cloudSet("/users", users);
  USERS = users;
  
  const g = {}; BASE_SUBJECTS.forEach(s => g[s] = [null,null,null,null,null]);
  await cloudSet("/grades/" + login, g);

  document.getElementById('newStLogin').value = '';
  document.getElementById('newStName').value = '';
  document.getElementById('newStPass').value = '';
  
  renderAdmin();
  alert('Ученик ' + name + ' создан!');
}

async function deleteStudent(login) {
  if (!confirm('Удалить пользователя ' + USERS[login].name + '?')) return;
  let users = await cloudGet("/users") || {};
  delete users[login];
  await cloudSet("/users", users);
  await cloudSet("/grades/" + login, null);
  USERS = users;
  renderAdmin();
}

async function toggleAdmin(login) {
  let users = await cloudGet("/users") || {};
  users[login].role = users[login].role === 'admin' ? 'student' : 'admin';
  await cloudSet("/users", users);
  USERS = users;
  renderAdmin();
}

window.addEventListener('load', () => {
  initTheme();
  const saved = sessionStorage.getItem('diary_user_v9');
  if (saved) { 
    cloudGet("/users").then(u => {
      if (u && u[saved]) { USERS = u; currentUser = saved; startApp(); }
    });
  }
  document.getElementById('loginPass').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
});
</script>
