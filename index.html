<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Электронный дневник</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { background: #f0f2f5; color: #1c1e21; -webkit-font-smoothing: antialiased; touch-action: manipulation; }

  /* ЭКРАН ВХОДА */
  #loginScreen { min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea, #764ba2); padding: 20px; }
  .login-box { background: #fff; padding: 32px 24px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); width: 100%; max-width: 380px; }
  .login-box h1 { text-align: center; margin-bottom: 6px; color: #333; font-size: 24px; }
  .login-box p.sub { text-align: center; color: #888; margin-bottom: 22px; font-size: 13px; }
  .login-box input { width: 100%; padding: 16px 18px; margin-bottom: 14px; border: 2px solid #eef0f3; border-radius: 14px; font-size: 16px; outline: none; background: #f8f9fb; transition: .2s; }
  .login-box input:focus { border-color: #667eea; background: #fff; }
  .login-box button { width: 100%; padding: 17px; background: #667eea; color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; transition: .15s; }
  .login-box button:active { transform: scale(.97); background: #556cd6; }
  .error { color: #e74c3c; font-size: 13px; text-align: center; margin-bottom: 10px; min-height: 18px; }

  /* ПРИЛОЖЕНИЕ */
  #app { display: none; padding-bottom: calc(72px + env(safe-area-inset-bottom)); min-height: 100dvh; }
  header { background: #fff; padding: 14px 18px; padding-top: calc(14px + env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
  header .logo { font-size: 17px; font-weight: 700; color: #667eea; }
  header .user { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  header .user .uname { font-size: 13px; color: #555; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* КОНТЕНТ */
  .container { padding: 16px; max-width: 600px; margin: 0 auto; }
  .tab-content { display: none; animation: fadeIn .2s ease; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.04); margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin-bottom: 12px; color: #333; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  
  /* МЕНЮ */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 20px rgba(0,0,0,.08); z-index: 30; border-top: 1px solid #f0f0f0; }
  .bottom-nav button { flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; color: #9aa0a6; font-size: 10px; font-weight: 600; transition: .15s; border-radius: 10px; }
  .bottom-nav button .icon { font-size: 22px; line-height: 1; transition: .15s; }
  .bottom-nav button.active { color: #667eea; }
  .bottom-nav button.active .icon { transform: scale(1.15); }

  /* ОЦЕНКИ */
  .subject-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; background: #f8f9fb; border-radius: 12px; margin-bottom: 10px; gap: 8px; }
  .subject-card .subj-name { font-weight: 600; font-size: 14px; color: #333; flex: 1; min-width: 0; }
  .grades-row { display: flex; gap: 5px; flex-shrink: 0; }
  .grade-pill { width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 8px; font-weight: 700; color: #fff; font-size: 13px; }
  .grade-pill.empty { background: #e8eaed; color: #b0b3b8; }
  .g5 { background: #27ae60; } .g4 { background: #3498db; } .g3 { background: #f39c12; } .g2 { background: #e74c3c; }
  .avg-badge { margin-left: 6px; font-size: 12px; font-weight: 700; color: #667eea; background: #eef1ff; padding: 4px 8px; border-radius: 8px; }

  /* ДОМАШКА */
  .hw-item { padding: 14px; background: #f8f9fb; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid #667eea; }
  .hw-item .subj { font-weight: 700; color: #667eea; margin-bottom: 5px; font-size: 13px; }
  .hw-item .task { font-size: 14px; color: #333; line-height: 1.45; }

  /* РАСПИСАНИЕ */
  .day-block { margin-bottom: 16px; }
  .day-name { font-weight: 700; color: #667eea; margin-bottom: 8px; font-size: 14px; }
  .lesson { display: flex; align-items: center; gap: 10px; padding: 12px; background: #f8f9fb; border-radius: 12px; margin-bottom: 7px; font-size: 13px; }
  .lesson .num { width: 26px; height: 26px; line-height: 26px; text-align: center; background: #eef1ff; color: #667eea; border-radius: 8px; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .lesson .info { flex: 1; }
  .lesson .info .name { font-weight: 600; color: #333; }
  .lesson .room { font-size: 11px; color: #667eea; background: #eef1ff; padding: 3px 8px; border-radius: 6px; font-weight: 600; }

  /* ФОРМЫ И КНОПКИ */
  input, select { width: 100%; padding: 12px; border: 2px solid #eef0f3; border-radius: 10px; font-size: 14px; outline: none; background: #f8f9fb; margin-bottom: 8px; }
  input:focus, select:focus { border-color: #667eea; background: #fff; }
  .btn { width: 100%; padding: 12px; background: #667eea; color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .btn:active { background: #556cd6; }
  .btn-red { background: #e74c3c; }
  .admin-badge { display: inline-block; padding: 3px 8px; background: #fef3c7; color: #92400e; border-radius: 20px; font-size: 10px; font-weight: 700; }
  .note-item { display: flex; justify-content: space-between; padding: 12px; background: #f8f9fb; border-radius: 12px; margin-bottom: 9px; }
  .empty-state { text-align: center; padding: 20px; color: #b0b3b8; font-size: 14px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>📚 Дневник</h1>
    <p class="sub">Приватный доступ</p>
    <div class="error" id="errorMsg"></div>
    <input type="text" id="loginUser" placeholder="Логин (admin, friend, teacher)" autocapitalize="none">
    <input type="password" id="loginPass" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <p style="text-align:center; font-size:12px; color:#999; margin-top:10px;">Подсказка: пароль = логин + 2024</p>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">📚 Дневник</div>
    <div class="user">
      <span class="uname" id="userName"></span>
      <div class="avatar" id="avatar"></div>
      <button onclick="logout()" style="background:none; border:none; font-size:20px; cursor:pointer;">🚪</button>
    </div>
  </header>

  <div class="container">
    <!-- ОЦЕНКИ -->
    <div id="tab-grades" class="tab-content active">
      <div class="card">
        <h2>📊 Оценки <span id="studentClassBadge" class="avg-badge"></span></h2>
        <div id="gradesList"></div>
      </div>
    </div>

    <!-- РАСПИСАНИЕ -->
    <div id="tab-schedule" class="tab-content">
      <div class="card">
        <h2>🗓️ Расписание</h2>
        <div id="scheduleList"></div>
        
        <!-- Блок редактирования (только для админа/учителя) -->
        <div id="scheduleEditor" style="display:none; margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
          <h3 style="font-size:14px; margin-bottom:10px; color:#667eea;">Добавить / изменить урок</h3>
          <select id="editDay">
            <option value="0">Понедельник</option>
            <option value="1">Вторник</option>
            <option value="2">Среда</option>
            <option value="3">Четверг</option>
            <option value="4">Пятница</option>
          </select>
          <input type="text" id="editSubject" placeholder="Предмет (напр. Алгебра)">
          <input type="text" id="editRoom" placeholder="Кабинет (напр. 204)">
          <button class="btn" onclick="saveLesson()">Сохранить урок</button>
        </div>
      </div>
    </div>

    <!-- ДОМАШКА -->
    <div id="tab-homework" class="tab-content">
      <div class="card">
        <h2>📝 Домашние задания</h2>
        <div id="homeworkList"></div>
      </div>
    </div>

    <!-- АДМИНКА / УЧИТЕЛЬСКАЯ -->
    <div id="tab-admin" class="tab-content">
      <div class="card">
        <h2>⚙️ Панель управления</h2>
        
        <!-- Выбор класса для ученика (только для админа) -->
        <div id="classSelectorBox" style="display:none; margin-bottom:20px; background:#f8f9fb; padding:12px; border-radius:10px;">
          <h3 style="font-size:13px; color:#92400e; margin-bottom:8px;">Мой класс</h3>
          <select id="myClassSelect" onchange="changeMyClass(this.value)">
            <option value="5А">5А</option>
            <option value="6Б">6Б</option>
            <option value="7А">7А</option>
            <option value="8В">8В</option>
            <option value="9А">9А</option>
            <option value="10Б">10Б</option>
            <option value="11А">11А</option>
          </select>
        </div>

        <!-- Выдача оценок (для учителя и админа) -->
        <div style="border-left: 4px solid #f39c12; padding-left: 12px; margin-bottom: 18px;">
          <h3 style="font-size:13px; color:#92400e; margin-bottom:10px;">Выдать оценку</h3>
          <select id="adminStudent">
            <option value="admin">Хозяин</option>
            <option value="friend">Друг</option>
          </select>
          <select id="adminSubject"></select>
          <div style="display:flex; gap:8px;">
            <select id="adminGrade">
              <option value="5">5</option>
              <option value="4">4</option>
              <option value="3">3</option>
              <option value="2">2</option>
            </select>
            <select id="adminDay">
              <option value="0">Пн</option>
              <option value="1">Вт</option>
              <option value="2">Ср</option>
              <option value="3">Чт</option>
              <option value="4">Пт</option>
            </select>
          </div>
          <button class="btn" onclick="teacherSetGrade()">Поставить оценку</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="active" onclick="showTab('grades', this)"><span class="icon">📊</span>Оценки</button>
    <button onclick="showTab('schedule', this)"><span class="icon">🗓️</span>Уроки</button>
    <button onclick="showTab('homework', this)"><span class="icon">📝</span>Домашка</button>
    <button id="adminTabBtn" style="display:none" onclick="showTab('admin', this)"><span class="icon">⚙️</span>Панель</button>
  </nav>
</div>

<script>
// ПОЛЬЗОВАТЕЛИ (Учитель добавлен)
const USERS = {
  "admin":   { pass: "admin2024",   name: "Хозяин", role: "admin",   class: "9А" },
  "friend":  { pass: "friend2024",  name: "Друг",   role: "admin",   class: "9А" },
  "teacher": { pass: "teacher2024", name: "Учитель", role: "teacher", class: "—"  }
};

const STORAGE_PREFIX = "diary_v2_";
const BASE_SUBJECTS = ["Математика", "Русский язык", "Литература", "История", "Физика", "Химия", "Английский", "Информатика", "Биология", "Физкультура"];

// Дефолтное расписание, если ничего нет
const DEFAULT_SCHEDULE = [
  { day: "Понедельник", lessons: [{ num: 1, time: "08:30", name: "Математика", room: "204" }, { num: 2, time: "09:25", name: "Русский", room: "112" }] },
  { day: "Вторник", lessons: [{ num: 1, time: "08:30", name: "Физика", room: "310" }] },
  { day: "Среда", lessons: [{ num: 1, time: "08:30", name: "Информатика", room: "410" }] },
  { day: "Четверг", lessons: [{ num: 1, time: "08:30", name: "История", room: "201" }] },
  { day: "Пятница", lessons: [{ num: 1, time: "08:30", name: "Биология", room: "210" }] }
];

let currentUser = null;

// --- ХРАНИЛИЩЕ ---
function loadGlobal(key, fallback) {
  try { const raw = localStorage.getItem(STORAGE_PREFIX + "global_" + key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
}
function saveGlobal(key, val) { localStorage.setItem(STORAGE_PREFIX + "global_" + key, JSON.stringify(val)); }

function loadUserData(user, key, fallback) {
  try { const raw = localStorage.getItem(STORAGE_PREFIX + user + "_" + key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; }
}
function saveUserData(user, key, val) { localStorage.setItem(STORAGE_PREFIX + user + "_" + key, JSON.stringify(val)); }

// --- ИНИЦИАЛИЗАЦИЯ ---
function initData() {
  // Общее расписание
  if (!localStorage.getItem(STORAGE_PREFIX + "global_schedule")) saveGlobal("schedule", DEFAULT_SCHEDULE);
  
  // Данные для каждого ученика
  ["admin", "friend"].forEach(u => {
    if (!localStorage.getItem(STORAGE_PREFIX + u + "_grades")) {
      const g = {}; BASE_SUBJECTS.forEach(s => g[s] = [null,null,null,null,null]);
      saveUserData(u, "grades", g);
    }
    if (!localStorage.getItem(STORAGE_PREFIX + u + "_class")) {
      saveUserData(u, "class", USERS[u].class);
    }
  });
}

// --- ВХОД ---
function login() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const user = USERS[u];
  if (user && user.pass === p) {
    currentUser = u;
    sessionStorage.setItem('diary_user_v2', u);
    document.getElementById('errorMsg').textContent = '';
    startApp();
  } else {
    document.getElementById('errorMsg').textContent = 'Ошибка входа';
  }
}

function logout() {
  sessionStorage.removeItem('diary_user_v2');
  location.reload();
}

function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const info = USERS[currentUser];
  document.getElementById('userName').textContent = info.name;
  document.getElementById('avatar').textContent = info.name[0].toUpperCase();
  
  if (info.role === 'admin' || info.role === 'teacher') {
    document.getElementById('adminTabBtn').style.display = 'flex';
    document.getElementById('scheduleEditor').style.display = 'block';
  }

  initData();
  renderAll();
}

// --- НАВИГАЦИЯ ---
function showTab(name, btn) {
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  window.scrollTo(0,0);
  if (name === 'admin') renderAdmin();
  if (name === 'schedule') renderSchedule();
}

function renderAll() {
  renderGrades();
  renderSchedule();
  renderHomework();
  renderAdmin();
}

// --- ОЦЕНКИ ---
function renderGrades() {
  // Если учитель - показываем пустоту или заглушку
  if (USERS[currentUser].role === 'teacher') {
    document.getElementById('gradesList').innerHTML = '<div class="empty-state">Учитель не имеет личных оценок. Используйте Панель.</div>';
    document.getElementById('studentClassBadge').textContent = '';
    return;
  }

  const cls = loadUserData(currentUser, "class", "—");
  document.getElementById('studentClassBadge').textContent = cls;

  const grades = loadUserData(currentUser, "grades", {});
  const el = document.getElementById('gradesList');
  
  el.innerHTML = BASE_SUBJECTS.map(subj => {
    const arr = grades[subj] || [null,null,null,null,null];
    const valid = arr.filter(x => x);
    const avg = valid.length ? (valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(1) : '—';
    const pills = arr.map(g => g ? `<span class="grade-pill g${g}">${g}</span>` : `<span class="grade-pill empty">·</span>`).join('');
    return `<div class="subject-card"><div class="subj-name">${subj}</div><div class="grades-row">${pills}</div><div class="avg-badge">${avg}</div></div>`;
  }).join('');
}

// --- РАСПИСАНИЕ ---
function renderSchedule() {
  const sch = loadGlobal("schedule", DEFAULT_SCHEDULE);
  const el = document.getElementById('scheduleList');
  el.innerHTML = sch.map(d => `
    <div class="day-block">
      <div class="day-name">📅 ${d.day}</div>
      ${d.lessons.length ? d.lessons.map(l => `
        <div class="lesson">
          <span class="num">${l.num}</span>
          <div class="info"><div class="name">${l.name}</div><div style="font-size:10px;color:#999;">${l.time}</div></div>
          <span class="room">${l.room}</span>
        </div>
      `).join('') : '<div style="font-size:12px;color:#999;padding:10px;">Нет уроков</div>'}
    </div>
  `).join('');
}

function saveLesson() {
  const dayIdx = parseInt(document.getElementById('editDay').value);
  const subj = document.getElementById('editSubject').value.trim();
  const room = document.getElementById('editRoom').value.trim();
  if (!subj) return alert('Введите название предмета');

  let sch = loadGlobal("schedule", DEFAULT_SCHEDULE);
  let lessons = sch[dayIdx].lessons;
  
  // Добавляем новый урок (номер = кол-во + 1)
  lessons.push({
    num: lessons.length + 1,
    time: "09:00", // Упрощенное время
    name: subj,
    room: room || "—"
  });

  // Сортируем по номеру
  lessons.sort((a,b) => a.num - b.num);
  sch[dayIdx].lessons = lessons;

  saveGlobal("schedule", sch);
  document.getElementById('editSubject').value = '';
  document.getElementById('editRoom').value = '';
  renderSchedule();
  alert('Урок добавлен!');
}

// --- ДОМАШКА ---
function renderHomework() {
  // Просто заглушка для красоты, можно расширить логику
  document.getElementById('homeworkList').innerHTML = '<div class="empty-state">Домашних заданий пока нет.</div>';
}

// --- АДМИНКА / УЧИТЕЛЬСКАЯ ---
function renderAdmin() {
  const role = USERS[currentUser].role;

  // Блок выбора класса (только для admin, не для teacher)
  if (role === 'admin') {
    document.getElementById('classSelectorBox').style.display = 'block';
    document.getElementById('myClassSelect').value = loadUserData(currentUser, "class", "9А");
  } else {
    document.getElementById('classSelectorBox').style.display = 'none';
  }

  // Заполняем предметы для выставления оценок
  const sel = document.getElementById('adminSubject');
  if (!sel.options.length) {
    BASE_SUBJECTS.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  }
}

function changeMyClass(newClass) {
  saveUserData(currentUser, "class", newClass);
  renderGrades();
  alert('Ваш класс изменен на ' + newClass);
}

function teacherSetGrade() {
  const student = document.getElementById('adminStudent').value;
  const subj = document.getElementById('adminSubject').value;
  const grade = parseInt(document.getElementById('adminGrade').value);
  const dayIdx = parseInt(document.getElementById('adminDay').value);

  let grades = loadUserData(student, "grades", {});
  if (!grades[subj]) grades[subj] = [null,null,null,null,null];
  grades[subj][dayIdx] = grade;
  saveUserData(student, "grades", grades);

  alert(`Оценка ${grade} по предмету ${subj} выставлена ученику ${USERS[student].name}`);
  
  // Если учитель ставит оценку сам себе (если это админ), обновляем экран
  if (student === currentUser) renderGrades();
}

// --- СТАРТ ---
window.addEventListener('load', () => {
  const saved = sessionStorage.getItem('diary_user_v2');
  if (saved && USERS[saved]) { currentUser = saved; startApp(); }
  document.getElementById('loginPass').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
});
</script>
</body>
</html>
